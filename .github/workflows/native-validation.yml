name: Tecnotron native Node validation

on:
  pull_request:
    branches:
      - tools
    paths:
      - .github/workflows/native-validation.yml
      - package.json
      - package-lock.json
      - tsconfig*.json
      - src/**
      - src-typescript/**
      - tests/**
      - scripts/**
  push:
    branches:
      - tools
    paths:
      - .github/workflows/native-validation.yml
      - package.json
      - package-lock.json
      - tsconfig*.json
      - src/**
      - src-typescript/**
      - tests/**
      - scripts/**

permissions:
  contents: read

concurrency:
  group: tecnotron-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact repository snapshot
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout subject
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          tree="$(git rev-parse 'HEAD^{tree}')"
          if [ "$observed" != "$EXPECTED_SHA" ]; then
            echo "SUBJECT_MISMATCH expected=$EXPECTED_SHA observed=$observed" >&2
            exit 1
          fi
          printf 'VALIDATED_SUBJECT_SHA=%s\nVALIDATED_SUBJECT_TREE=%s\n' "$observed" "$tree"

      - name: Set up Node 22 with npm download cache
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies from pinned lock
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run repository test suite
        run: npm test

      - name: Validate portable contract package
        run: npm run contracts:check
