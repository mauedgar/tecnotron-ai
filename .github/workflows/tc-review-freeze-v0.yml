name: TC Review Freeze v0

on:
  push:
    branches:
      - devlab/tc-review-freeze-v0
    paths:
      - .tc-review/request.json

permissions:
  contents: read
  actions: read

concurrency:
  group: tc-review-freeze-v0
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout freeze binding
        uses: actions/checkout@v4

      - name: Parse freeze request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          test -f .tc-review/request.json

          schema="$(jq -r '.schema_version // empty' .tc-review/request.json)"
          dispatch="$(jq -r '.dispatch // empty' .tc-review/request.json)"
          test "$schema" = "tecnotron-tc-review-freeze-request/v0"

          if [ "$dispatch" != "AUTHORIZED" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -e '
            (.request_id | type == "string" and length > 0) and
            (.interface_id | type == "string" and length > 0) and
            (.taskcycle | type == "string" and length > 0) and
            (.responsibility | type == "string" and length > 0) and
            (.executor.branch | type == "string" and length > 0) and
            (.executor.commit | test("^[0-9a-f]{40}$")) and
            (.executor.tree | test("^[0-9a-f]{40}$")) and
            (.subject.branch | type == "string" and length > 0) and
            ((.subject.exact_subject.accepted_tip // .subject.exact_subject.commit) | test("^[0-9a-f]{40}$")) and
            ((.subject.exact_subject.accepted_tip_tree // .subject.exact_subject.tree) | test("^[0-9a-f]{40}$")) and
            (.worker_evidence.ref | type == "string" and startswith("refs/heads/")) and
            (.worker_evidence.commit | test("^[0-9a-f]{40}$")) and
            (.validation.run_id | type == "number") and
            (.validation.artifact_name | type == "string" and length > 0) and
            (.validation.files | type == "array" and length > 0) and
            (.authority_refs | type == "array" and length > 0) and
            (.review_request_markdown | type == "string" and length > 0)
          ' .tc-review/request.json >/dev/null

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "request_id=$(jq -r '.request_id' .tc-review/request.json)" >> "$GITHUB_OUTPUT"
          echo "executor_commit=$(jq -r '.executor.commit' .tc-review/request.json)" >> "$GITHUB_OUTPUT"
          echo "executor_tree=$(jq -r '.executor.tree' .tc-review/request.json)" >> "$GITHUB_OUTPUT"
          echo "subject_branch=$(jq -r '.subject.branch' .tc-review/request.json)" >> "$GITHUB_OUTPUT"
          echo "subject_commit=$(jq -r '.subject.exact_subject.accepted_tip // .subject.exact_subject.commit' .tc-review/request.json)" >> "$GITHUB_OUTPUT"
          echo "subject_tree=$(jq -r '.subject.exact_subject.accepted_tip_tree // .subject.exact_subject.tree' .tc-review/request.json)" >> "$GITHUB_OUTPUT"
          echo "worker_ref=$(jq -r '.worker_evidence.ref' .tc-review/request.json)" >> "$GITHUB_OUTPUT"
          echo "worker_commit=$(jq -r '.worker_evidence.commit' .tc-review/request.json)" >> "$GITHUB_OUTPUT"
          echo "validation_run_id=$(jq -r '.validation.run_id' .tc-review/request.json)" >> "$GITHUB_OUTPUT"
          echo "validation_artifact_name=$(jq -r '.validation.artifact_name' .tc-review/request.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact freeze executor
        if: steps.request.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.executor_commit }}
          path: executor
          fetch-depth: 1

      - name: Verify freeze executor identity
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C executor rev-parse HEAD^{commit})" = "${{ steps.request.outputs.executor_commit }}"
          test "$(git -C executor rev-parse HEAD^{tree})" = "${{ steps.request.outputs.executor_tree }}"

      - name: Checkout exact frozen subject
        if: steps.request.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.subject_branch }}
          path: subject
          fetch-depth: 0

      - name: Verify frozen subject identity
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C subject rev-parse HEAD^{commit})" = "${{ steps.request.outputs.subject_commit }}"
          test "$(git -C subject rev-parse HEAD^{tree})" = "${{ steps.request.outputs.subject_tree }}"
          test -z "$(git -C subject status --porcelain=v1 --untracked-files=all)"

      - name: Checkout exact worker evidence commit
        if: steps.request.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.worker_commit }}
          path: worker-evidence
          fetch-depth: 1

      - name: Verify worker evidence ref correspondence
        if: steps.request.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C worker-evidence rev-parse HEAD^{commit})" = "${{ steps.request.outputs.worker_commit }}"
          remote_oid="$(git -C worker-evidence ls-remote origin "${{ steps.request.outputs.worker_ref }}" | awk '{print $1}')"
          test "$remote_oid" = "${{ steps.request.outputs.worker_commit }}"

      - name: Set up Node 22
        if: steps.request.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
          cache-dependency-path: executor/package-lock.json

      - name: Install executor dependencies
        if: steps.request.outputs.enabled == 'true'
        working-directory: executor
        shell: bash
        run: npm ci

      - name: Download exact validation evidence
        if: steps.request.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.request.outputs.validation_artifact_name }}
          run-id: ${{ steps.request.outputs.validation_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: validation-evidence

      - name: Materialize frozen review interface
        if: steps.request.outputs.enabled == 'true'
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _tc_review_result
          set +e
          node .tc-review/run-freeze.js             .tc-review/request.json             "$PWD/executor"             "$PWD/subject"             "$PWD/worker-evidence"             "$PWD/validation-evidence"             "$PWD/_tc_review_result"             > _tc_review_result/runner.stdout.log             2> _tc_review_result/runner.stderr.log
          rc=$?
          set -e
          echo "runner_exit=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload frozen review interface
        if: steps.request.outputs.enabled == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: tc-review-freeze-${{ steps.request.outputs.request_id }}
          path: _tc_review_result/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Fail on freeze failure
        if: steps.request.outputs.enabled == 'true' && always()
        shell: bash
        run: |
          test "${{ steps.freeze.outputs.runner_exit }}" = "0"
