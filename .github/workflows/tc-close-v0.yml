name: TC Lifecycle Close v0

on:
  push:
    branches:
      - devlab/tc-web-execution-v0
    paths:
      - .tc-web/lifecycle-close-request.json

permissions:
  contents: read

concurrency:
  group: tc-lifecycle-close-v0
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout execution workspace
        uses: actions/checkout@v4

      - name: Parse close request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == "tecnotron-taskcycle-close-request/v0" and
            (.taskcycle.id | type == "string" and length > 0) and
            (.candidate.commit | test("^[0-9a-f]{40}$")) and
            (.candidate.tree | test("^[0-9a-f]{40}$")) and
            (.Phase_2.post_tools == .candidate.commit)
          ' .tc-web/lifecycle-close-request.json >/dev/null
          echo "tip=$(jq -r '.candidate.commit' .tc-web/lifecycle-close-request.json)" >> "$GITHUB_OUTPUT"
          echo "tree=$(jq -r '.candidate.tree' .tc-web/lifecycle-close-request.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout exact canonical subject
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.req.outputs.tip }}
          path: subject
          fetch-depth: 0

      - name: Verify canonical Product effect
        shell: bash
        run: |
          set -euo pipefail
          cd subject
          test "$(git rev-parse HEAD)" = "${{ steps.req.outputs.tip }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ steps.req.outputs.tree }}"
          remote_tools="$(git ls-remote origin refs/heads/tools | awk '{print $1}')"
          test "$remote_tools" = "${{ steps.req.outputs.tip }}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install subject dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd subject
          npm ci --ignore-scripts=false >/dev/null
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize kernel-free lifecycle close
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _lifecycle/init-root _lifecycle/phase1-root _lifecycle/close-root
          export EXECUTION_ROOT="$PWD"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const root = process.env.EXECUTION_ROOT;
          const spec = JSON.parse(fs.readFileSync(path.join(root, '.tc-web/lifecycle-close-request.json'), 'utf8'));
          const subjectRoot = path.join(root, 'subject');

          const {
            createTaskCycleInitializationCapability,
            consumeTaskCycleInitialization,
          } = require(path.join(subjectRoot, 'src/deterministic-taskcycle-substrate-v0/taskcycle-initialization.js'));
          const {
            createTaskCycleEffectReconciliationCapability,
            consumeTaskCycleEffectReconciliation,
          } = require(path.join(subjectRoot, 'src/deterministic-taskcycle-substrate-v0/taskcycle-effect-reconciliation.js'));
          const {
            createTaskCyclePostPhase1LifecycleCapability,
            consumeTaskCyclePostPhase1Lifecycle,
          } = require(path.join(subjectRoot, 'src/deterministic-taskcycle-substrate-v0/taskcycle-post-phase1-lifecycle.js'));

          const sha256File = (p) => 'sha256:' + crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          const authority = spec.Developer_acceptance.authority_ref;
          const obligations = [
            'implementation',
            'promotion_grade_validation',
            'exact_candidate',
            'frozen_review_interface',
            'independent_review',
            'Developer_acceptance',
            'Phase_2',
            'effect_reconciliation',
            'logical_close',
          ].map((id) => ({ id, authority_ref: null }));

          const initializationRequest = {
            taskcycle: spec.taskcycle,
            Product_baseline: spec.Product_baseline,
            TASK_carrier: spec.TASK_carrier,
            write_scope: spec.write_scope,
            obligations,
            current_gate: 'PHASE1_IMPLEMENT_BOUNDED_CANDIDATE',
            authority_refs: [authority],
            evidence_refs: [
              'GIT:' + spec.Product_baseline.commit,
              'TASK:' + spec.TASK_carrier.commit,
            ],
          };
          const initializationObserved = {
            Product_baseline: spec.Product_baseline,
            TASK_carrier: spec.TASK_carrier,
          };
          const init = createTaskCycleInitializationCapability({ root: path.join(root, '_lifecycle/init-root') })
            .initializeTaskCycle({ request: initializationRequest, observed: initializationObserved });
          fs.writeFileSync(path.join(root, '_lifecycle/initialization-result.json'), JSON.stringify(init, null, 2) + '\n');
          if (init.status !== 'PASS' || init.effect_state !== 'CONFIRMED') {
            throw new Error('INITIALIZATION_NOT_PASS:' + JSON.stringify(init));
          }
          consumeTaskCycleInitialization({
            location: init.portable_projection.location_or_ref,
            expected_identity_sha256: init.portable_projection.identity_sha256,
          });

          const phase1Request = {
            taskcycle: spec.taskcycle,
            initialization: {
              location_or_ref: init.portable_projection.location_or_ref,
              identity_sha256: init.portable_projection.identity_sha256,
            },
            obligation: {
              id: 'implementation',
              semantic_status: 'COMPLETED_BEFORE_LIFECYCLE_INITIALIZATION',
            },
            subject: spec.phase1_subject,
            authority_refs: [authority],
            evidence_refs: ['GIT:' + spec.phase1_subject.commit],
            next_gate: 'PROMOTION_GRADE_VALIDATION',
          };
          const phase1 = createTaskCycleEffectReconciliationCapability({ root: path.join(root, '_lifecycle/phase1-root') })
            .reconcileCompletedObligation({ request: phase1Request, observed: { subject: spec.phase1_subject } });
          fs.writeFileSync(path.join(root, '_lifecycle/phase1-reconciliation-result.json'), JSON.stringify(phase1, null, 2) + '\n');
          if (phase1.status !== 'PASS' || phase1.effect_state !== 'CONFIRMED' || phase1.replayed !== false) {
            throw new Error('PHASE1_RECONCILIATION_NOT_PASS:' + JSON.stringify(phase1));
          }
          consumeTaskCycleEffectReconciliation({
            location: phase1.portable_projection.location_or_ref,
            expected_identity_sha256: phase1.portable_projection.identity_sha256,
          });

          const irPath = path.join(root, spec.independent_review.result_path);
          const irHash = sha256File(irPath);

          const candidate = {
            ...spec.candidate,
            provenance: { phase1_subject: spec.phase1_subject },
          };
          const validation = {
            ...spec.validation,
            exact_candidate_commit: candidate.commit,
            exact_candidate_tree: candidate.tree,
          };
          const frozen = {
            id: spec.freeze.id,
            prompt_sha256: 'sha256:' + spec.freeze.prompt_sha256,
            subject_commit: candidate.commit,
            subject_tree: candidate.tree,
          };
          const ir = {
            id: spec.independent_review.id,
            verdict: spec.independent_review.verdict,
            subject_commit: candidate.commit,
            subject_tree: candidate.tree,
            result_sha256: irHash,
            blocking_findings: spec.independent_review.blocking_findings,
          };
          const acceptance = {
            status: spec.Developer_acceptance.status,
            authority_ref: authority,
            subject_commit: candidate.commit,
            subject_tree: candidate.tree,
          };

          const closeRequest = {
            taskcycle: spec.taskcycle,
            source_reconciliation: {
              location_or_ref: phase1.portable_projection.location_or_ref,
              identity_sha256: phase1.portable_projection.identity_sha256,
            },
            candidate,
            promotion_grade_validation: validation,
            frozen_review_interface: frozen,
            independent_review: ir,
            Developer_acceptance: acceptance,
            Phase_2: spec.Phase_2,
            effect_reconciliation: spec.effect_reconciliation,
            logical_close: spec.logical_close,
            authority_refs: [authority],
            evidence_refs: [
              'RUN:' + spec.validation.run_id,
              'FREEZE:' + spec.freeze.archive_sha256,
              'IR:' + spec.independent_review.id,
              'GIT:' + candidate.commit,
              'PHASE2:' + spec.Phase_2.pre_tools + '..' + spec.Phase_2.post_tools,
            ],
          };
          const observed = {
            candidate: closeRequest.candidate,
            promotion_grade_validation: closeRequest.promotion_grade_validation,
            frozen_review_interface: closeRequest.frozen_review_interface,
            independent_review: closeRequest.independent_review,
            Developer_acceptance: closeRequest.Developer_acceptance,
            Phase_2: closeRequest.Phase_2,
            effect_reconciliation: closeRequest.effect_reconciliation,
            logical_close: closeRequest.logical_close,
          };

          const closed = createTaskCyclePostPhase1LifecycleCapability({ root: path.join(root, '_lifecycle/close-root') })
            .closeFromResolvedLifecycle({ request: closeRequest, observed });
          fs.writeFileSync(path.join(root, '_lifecycle/terminal-close-result.json'), JSON.stringify(closed, null, 2) + '\n');
          if (closed.status !== 'PASS' || closed.effect_state !== 'CONFIRMED' || closed.TaskCycle?.state !== 'CLOSED') {
            throw new Error('TERMINAL_CLOSE_NOT_PASS:' + JSON.stringify(closed));
          }
          const consumed = consumeTaskCyclePostPhase1Lifecycle({
            location: closed.portable_projection.location_or_ref,
            expected_identity_sha256: closed.portable_projection.identity_sha256,
          });
          fs.writeFileSync(path.join(root, '_lifecycle/terminal-consume.json'), JSON.stringify({
            identity_sha256: consumed.identity_sha256,
            TaskCycle: consumed.projection.TaskCycle,
            terminal_disposition_ref: consumed.projection.terminal_disposition_ref,
            pending_obligations: consumed.projection.pending_obligations,
            obligations: consumed.projection.obligations,
            Phase_2: consumed.projection.lifecycle_evidence.Phase_2,
            State_Kernel_direct_calls: consumed.projection.semantics.State_Kernel_direct_calls,
          }, null, 2) + '\n');

          process.stdout.write(JSON.stringify({
            status: 'PASS',
            initialization_identity: init.portable_projection.identity_sha256,
            phase1_identity: phase1.portable_projection.identity_sha256,
            terminal_identity: closed.portable_projection.identity_sha256,
            State_Kernel_direct_calls: closed.State_Kernel_direct_calls,
          }, null, 2) + '\n');
          NODE

      - name: Upload lifecycle close evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tc-lifecycle-close-accepted-range-phase2-lifecycle-001
          path: _lifecycle/
          if-no-files-found: error
          retention-days: 14
