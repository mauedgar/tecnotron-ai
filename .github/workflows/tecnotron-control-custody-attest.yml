name: Tecnotron custody signer qualification (NONPRODUCT)
# Synthetic attestation only. It MUST NOT issue a Product Control grant.
# The signer on this experiment branch is NOT a Product-qualified issuer.
on:
  push:
    branches:
      - experiment/tecnotron-a01-github-attestation-20261105-001
    paths:
      - .github/workflows/tecnotron-control-custody-attest.yml

  workflow_dispatch:
    inputs:
      grant_comment_id:
        description: 'Exact Developer Control grant comment ID in Tecnotron issue 35'
        type: string
        required: true

run-name: ${{ github.event_name == 'workflow_dispatch' && format('TECNOTRON-CUSTODY-GRANT-{0}', inputs.grant_comment_id) || 'TECNOTRON-CUSTODY-NONPRODUCT-SYNTHETIC' }}

# A single source of signed evidence: serialized across every dispatch and push.
# Pending executions queue; they NEVER cancel an earlier attempt.
concurrency:
  group: tecnotron-control-custody-all
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  synthetic-attestation:
    if: >-
      ${{ github.repository == 'mauedgar/tecnotron-ai' && github.repository_id == '1339077141' && github.event_name == 'push' && github.ref == 'refs/heads/experiment/tecnotron-a01-github-attestation-20261105-001' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Prepare fixed NONPRODUCT fixture and check caller identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mauedgar/tecnotron-ai"
          test "$GITHUB_REPOSITORY_ID" = "1339077141"
          test "$GITHUB_REF" = "refs/heads/experiment/tecnotron-a01-github-attestation-20261105-001"
          mkdir -p qualification
          cat > qualification/manifest.json <<'FIXTURE'
          {"schema":"tecnotron-github-custody-signer-qualification/v1","fixture":"TS-GITHUB-CUSTODY-QUAL-001","Product_authority":"NONE","Product_effect":"NONE","kind":"NONPRODUCT_SYNTHETIC"}
          FIXTURE
          sha256sum qualification/manifest.json | tee qualification/input-sha256.txt

      - name: Sign fixed synthetic artifact (no Product grant)
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # official actions/attest v4 resolved immutable SHA
        with:
          subject-path: qualification/manifest.json

      - name: Verify signer, source, timestamp and negative mutations
        shell: bash
        env:
          ATTEST_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTEST_BUNDLE"
          gh --version
          verify=(
            --repo "mauedgar/tecnotron-ai"
            --bundle "$ATTEST_BUNDLE"
            --signer-workflow "mauedgar/tecnotron-ai/.github/workflows/tecnotron-control-custody-attest.yml"
            --signer-digest "$GITHUB_SHA"
            --source-ref "$GITHUB_REF"
            --cert-oidc-issuer "https://token.actions.githubusercontent.com"
            --deny-self-hosted-runners
            --format json
          )
          gh attestation verify qualification/manifest.json "${verify[@]}" > qualification/verified.json
          jq -e 'type == "array" and length > 0 and all(.[]; .verificationResult.signature.certificate != null)' qualification/verified.json >/dev/null
          echo "ATTESTATION_POSITIVE=PASS"
          # One mismatched identity at a time: every case must be rejected.
          if gh attestation verify qualification/manifest.json "${verify[@]}" --signer-workflow "mauedgar/tecnotron-ai/.github/workflows/evil.yml" >/dev/null 2>&1; then
            echo "NEGATIVE_SIGNER_UNEXPECTED_PASS" >&2; exit 1
          fi
          echo "ATTESTATION_NEGATIVE_SIGNER=REJECTED"
          if gh attestation verify qualification/manifest.json "${verify[@]}" --source-ref refs/heads/main >/dev/null 2>&1; then
            echo "NEGATIVE_SOURCE_REF_UNEXPECTED_PASS" >&2; exit 1
          fi
          echo "ATTESTATION_NEGATIVE_SOURCE_REF=REJECTED"
          if gh attestation verify qualification/manifest.json "${verify[@]}" --signer-digest 0000000000000000000000000000000000000000 >/dev/null 2>&1; then
            echo "NEGATIVE_SIGNER_DIGEST_UNEXPECTED_PASS" >&2; exit 1
          fi
          echo "ATTESTATION_NEGATIVE_SIGNER_DIGEST=REJECTED"
          cp qualification/manifest.json qualification/tampered.json
          printf '\nTAMPERED' >> qualification/tampered.json
          if gh attestation verify qualification/tampered.json "${verify[@]}" >/dev/null 2>&1; then
            echo "NEGATIVE_TAMPER_UNEXPECTED_PASS" >&2; exit 1
          fi
          echo "ATTESTATION_NEGATIVE_TAMPER=REJECTED"
          jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg run "$GITHUB_RUN_ID" \
            '{schema:"tecnotron-github-custody-signer-qualification-receipt/v1", Product_authority:"NONE", Product_effect:"NONE", candidate_sha:$sha, source_ref:$ref, provider_run_id:$run, positive:"PASS", wrong_signer:"REJECTED", wrong_ref:"REJECTED", wrong_digest:"REJECTED", tamper:"REJECTED"}' \
            > qualification/receipt.json
          cat qualification/receipt.json

      - name: Upload original qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # official upload-artifact v4 resolved immutable SHA
        with:
          name: tecnotron-control-custody-nonproduct-qualification
          if-no-files-found: warn
          retention-days: 14
          path: |
            qualification/manifest.json
            qualification/input-sha256.txt
            qualification/verified.json
            qualification/receipt.json
            ${{ steps.attest.outputs.bundle-path }}

  # Product-provenance evidence only, not TaskCycle mutation, Phase2 or merge.
  # This job is unreachable until the workflow has been competently integrated
  # into default main AND the exact main signer commit is separately pinned
  # by the Product verifier. Never accept dispatch payload as its own grant.
  signed-control-custody:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository_id == '1339077141' && github.actor_id == '54420195' && github.actor == 'mauedgar' && github.triggering_actor == 'mauedgar' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Independently authenticate immutable issue-35 Developer grant
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GRANT_ID: ${{ inputs.grant_comment_id }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "mauedgar/tecnotron-ai"
          test "$GITHUB_REPOSITORY_ID" = "1339077141"
          test "$GITHUB_ACTOR_ID" = "54420195"
          test "$GITHUB_ACTOR" = "mauedgar"
          test "$GITHUB_TRIGGERING_ACTOR" = "mauedgar"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$GRANT_ID" =~ ^[1-9][0-9]{5,19}$ ]] || { echo "GRANT_ID_INVALID" >&2; exit 1; }
          mkdir -p custody
          gh api "repos/mauedgar/tecnotron-ai/issues/comments/$GRANT_ID" > custody/observed-comment.json
          jq -e --arg issue "https://api.github.com/repos/mauedgar/tecnotron-ai/issues/35" \
            '.user.id == 54420195 and .user.login == "mauedgar" and
             .issue_url == $issue and .author_association == "OWNER" and
             .created_at == .updated_at and (.body | type == "string")' \
            custody/observed-comment.json > /dev/null
          jq -er '.body' custody/observed-comment.json > custody/grant.json
          jq -e '
            ((keys | sort) == ([
              "schema", "repository", "taskcycle_id", "subject_commit",
              "subject_tree", "original_task_commit", "source_code_commit",
              "execution_attempt_id", "qualification_receipt_ref"
            ] | sort)) and
            .schema == "tecnotron-control-git-custody-grant/v1" and
            .repository == "mauedgar/tecnotron-ai" and
            (.taskcycle_id | type == "string" and test("^TASKCYCLE-[A-Za-z0-9_.-]+$")) and
            (.execution_attempt_id | type == "string" and test("^[A-Za-z0-9_.:-]{10,160}$")) and
            ([.subject_commit,.subject_tree,.original_task_commit,.source_code_commit] |
              all(.[]; type == "string" and test("^[a-f0-9]{40}$"))) and
            (.qualification_receipt_ref | type == "string" and
             startswith("https://github.com/mauedgar/tecnotron-ai/issues/35#issuecomment-"))
          ' custody/grant.json > /dev/null
          subject="$(jq -er '.subject_commit' custody/grant.json)"
          expected_tree="$(jq -er '.subject_tree' custody/grant.json)"
          expected_parent="$(jq -er '.original_task_commit' custody/grant.json)"
          source="$(jq -er '.source_code_commit' custody/grant.json)"
          gh api "repos/mauedgar/tecnotron-ai/git/commits/$subject" > custody/subject-object.json
          jq -e --arg tree "$expected_tree" --arg parent "$expected_parent" \
            '.tree.sha == $tree and (.parents | length == 1 and .[0].sha == $parent)' \
            custody/subject-object.json > /dev/null
          gh api "repos/mauedgar/tecnotron-ai/git/ref/heads/tools" |
            jq -e --arg source "$source" '.object.sha == $source' > /dev/null
          gh api "repos/mauedgar/tecnotron-ai/git/commits/$expected_parent" |
            jq -e --arg sha "$expected_parent" '.sha == $sha' > /dev/null
          control_ref="https://github.com/mauedgar/tecnotron-ai/issues/35#issuecomment-$GRANT_ID"
          jq -cS --arg control_ref "$control_ref" \
            '{schema:"tecnotron-control-git-custody/v1",
              repository, taskcycle_id, subject_commit, subject_tree,
              original_task_commit, source_code_commit, execution_attempt_id,
              control_resolution_ref:$control_ref, qualification_receipt_ref}' \
            custody/grant.json > custody/manifest.json
          # Refuse an edited/replaced Developer grant during signing.
          gh api "repos/mauedgar/tecnotron-ai/issues/comments/$GRANT_ID" > custody/after-comment.json
          cmp -s custody/observed-comment.json custody/after-comment.json || {
            echo "GRANT_COMMENT_CHANGED_DURING_AUTHENTICATION" >&2; exit 1;
          }
          # Same logical ExecutionAttempt cannot be signed under two owner
          # comments, and one grant cannot be issued twice. The job's global
          # GitHub Actions concurrency lock serializes the check and signature.
          test "$GITHUB_RUN_ATTEMPT" = "1" || {
            echo "ISSUER_ATTEMPT_REPLAY_BLOCKED" >&2; exit 1;
          }
          attempt="$(jq -er '.execution_attempt_id' custody/grant.json)"
          gh api --paginate "repos/mauedgar/tecnotron-ai/issues/35/comments?per_page=100" > custody/comment-pages.jsonl
          test "$(wc -c < custody/comment-pages.jsonl)" -le 6291456 || {
            echo "ISSUER_COMMENT_INVENTORY_TOO_LARGE" >&2; exit 1;
          }
          jq -s -e --arg attempt "$attempt" --argjson grant "$GRANT_ID" '
            [.[][] | select((.body | type) == "string") |
              {id, parsed:(.body | fromjson? // {})} |
              select(.parsed.schema == "tecnotron-control-git-custody-grant/v1"
                and .parsed.execution_attempt_id == $attempt) | .id] |
            length == 1 and .[0] == $grant
          ' custody/comment-pages.jsonl > /dev/null
          gh api --paginate "repos/mauedgar/tecnotron-ai/actions/workflows/tecnotron-control-custody-attest.yml/runs?event=workflow_dispatch&per_page=100" > custody/run-pages.jsonl
          test "$(wc -c < custody/run-pages.jsonl)" -le 6291456 || {
            echo "ISSUER_RUN_INVENTORY_TOO_LARGE" >&2; exit 1;
          }
          jq -s -e --arg run "$GITHUB_RUN_ID" --arg title "TECNOTRON-CUSTODY-GRANT-$GRANT_ID" '
            [.[] | .workflow_runs[] | select(.display_title == $title)] |
            length == 1 and .[0].id == ($run | tonumber) and .[0].run_attempt == 1
          ' custody/run-pages.jsonl > /dev/null
          # The GitHub repository attestation index is authoritative about
          # already-signed manifest bytes; all API failures fail CLOSED.
          sha256sum custody/manifest.json | tee custody/manifest.sha256
          signed_digest="$(cut -d' ' -f1 custody/manifest.sha256)"
          gh api "repos/mauedgar/tecnotron-ai/attestations/sha256:$signed_digest" > custody/prior-attestations.json
          jq -e '.attestations | type == "array" and length == 0' custody/prior-attestations.json >/dev/null
          # Historical snapshot only. A changed or revoked comment requires
          # a distinct, authenticated Control decision; no silent renewal.
          gh api "repos/mauedgar/tecnotron-ai/issues/comments/$GRANT_ID" > custody/last-comment.json
          cmp -s custody/observed-comment.json custody/last-comment.json || {
            echo "GRANT_DRIFT_BEFORE_SIGNATURE" >&2; exit 1;
          }
          echo "GITHUB_DEVELOPER_GRANT_AUTHENTICATED=PASS"
          echo "GITHUB_CONTROL_UNIQUE_ATTEMPT=PASS"

      - name: Attest only the verified exact Control grant
        id: issue
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: custody/manifest.json

      - name: Verify original signed subject, main source and workflow issuer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEST_BUNDLE: ${{ steps.issue.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTEST_BUNDLE"
          gh attestation verify custody/manifest.json \
            --repo mauedgar/tecnotron-ai \
            --bundle "$ATTEST_BUNDLE" \
            --signer-workflow mauedgar/tecnotron-ai/.github/workflows/tecnotron-control-custody-attest.yml \
            --signer-digest "$GITHUB_SHA" \
            --source-ref refs/heads/main \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --deny-self-hosted-runners \
            --format json > custody/verified.json
          jq -e 'type == "array" and length > 0 and
            all(.[]; .verificationResult.signature.certificate.githubWorkflowTrigger == "workflow_dispatch"
              and .verificationResult.signature.certificate.runnerEnvironment == "github-hosted"
              and .verificationResult.signature.certificate.sourceRepositoryIdentifier == "1339077141")' \
            custody/verified.json > /dev/null
          echo "GITHUB_CONTROL_ISSUER_SIGNED=PASS"
          jq -n --arg run "$GITHUB_RUN_ID" --arg sha "$GITHUB_SHA" \
            '{schema:"tecnotron-control-git-custody-signature-receipt/v1",
              provider_run_id:$run, signer_commit:$sha,
              attestation:"VERIFIED", Product_effect:"NONE",
              Product_acceptance:false, Phase2:false, lifecycle_close:false}' \
            > custody/receipt.json

      - name: Upload original verified custody evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tecnotron-control-custody-attested-grant
          if-no-files-found: warn
          retention-days: 14
          path: |
            custody/manifest.json
            custody/manifest.sha256
            custody/verified.json
            custody/receipt.json
            ${{ steps.issue.outputs.bundle-path }}
